# GymProcess · n8n + PostgreSQL
# Un solo servidor Postgres con dos bases:
#   - n8n : uso interno de n8n (workflows, credenciales, ejecuciones)
#   - gym : datos de la aplicación (usuario restringido gym_app)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: n8n
      GYM_DB: gym
      GYM_APP_USER: ${GYM_APP_USER}
      GYM_APP_PASSWORD: ${GYM_APP_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # solo corre la PRIMERA vez (volumen vacío)
      - ./db/sql:/gym-sql:ro
    ports:
      - "127.0.0.1:5432:5432"                      # solo accesible desde tu máquina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest          # en producción fija una versión concreta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_ADMIN_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${WEBHOOK_URL}                  # URL pública HTTPS (Telegram la exige)
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"               # 14 días de historial de ejecuciones
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pg_data:
  n8n_data:
